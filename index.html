<style>
  body {

    margin: 0;
    padding: 20px;
  }
  .container {
    display: flex;
    gap: 30px;
    max-width: 1150px;
    margin: 0 auto;
    align-items: flex-start;
  }
  .search-area, .list-area {
    flex: 1;
    width: 100%;
  }
  .search-area {
    position: sticky;
    top: 20px;
  }
  @media (max-width: 768px) {
    .container {
      flex-direction: column;
    }
    .search-area {
      position: static;
    }
  }
  h3 {
    margin-top: 0;
    margin-bottom: 12px;
    font-size: 18px;
    color: #fff;
  }
  .search-wrapper {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .search-box {
    flex: 1;
    padding: 12px 14px;
    font-size: 16px;
    background-color: #222;
    color: #fff;
    border: 1px solid #555;
    border-radius: 6px;
    box-sizing: border-box;
    outline: none;
  }
  .search-box:focus {
    border-color: #4da6ff;
  }
  .clear-btn {
    padding: 0 16px;
    background-color: #333;
    color: #ccc;
    border: 1px solid #555;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
  }
  .clear-btn:hover {
    background-color: #444;
    color: #fff;
  }
  .count-info {
    font-size: 13px;
    color: #aaa;
    margin-bottom: 10px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background-color: #1a1a1a;
    font-size: 14px;
  }
  th, td {
    border: 1px solid #333;
    padding: 9px 12px;
    text-align: left;
  }
  th {
    background-color: #2a2a2a;
    color: #fff;
    font-weight: bold;
  }
  tr:hover {
    background-color: #262626;
  }
  .empty-msg {
    color: #777;
    text-align: center;
    padding: 20px;
  }
</style>
</head>

  const searchInput = document.getElementById("searchInput");
  const clearBtn = document.getElementById("clearBtn");
  const searchResult = document.getElementById("searchResult");
  const resultCount = document.getElementById("resultCount");
  const allData = document.getElementById("allData");
  const allTitle = document.getElementById("allTitle");

  // 全角スペースを半角スペースに統一して小文字化する関数
  function normalize(str) {
    return str.replace(/　/g, " ").toLowerCase();
  }

  // 全一覧を描画
  allTitle.textContent = `📋 全一覧（全${characterData.length}件）`;
  allData.innerHTML = characterData.map(item => `
    <tr>
      <td>${item.name}</td>
      <td>${item.condition}</td>
    </tr>
  `).join("");

  // 検索実行処理
  function doSearch() {
    const rawKeyword = searchInput.value.trim();
    if (rawKeyword === "") {
      resultCount.textContent = "文字を入力すると検索結果が表示されます";
      searchResult.innerHTML = `<tr><td colspan="2" class="empty-msg">検索キーワードを入力してください</td></tr>`;
      return;
    }

    // スペース区切りでAND検索にも対応
    const keywords = normalize(rawKeyword).split(/\s+/);
    const filtered = characterData.filter(item => {
      const targetText = normalize(item.name + " " + item.condition);
      return keywords.every(kw => targetText.includes(kw));
    });

    resultCount.textContent = `検索結果：${filtered.length}件`;
    if (filtered.length === 0) {
      searchResult.innerHTML = `<tr><td colspan="2" class="empty-msg">一致するデータが見つかりませんでした</td></tr>`;
    } else {
      searchResult.innerHTML = filtered.map(item => `
        <tr>
          <td>${item.name}</td>
          <td>${item.condition}</td>
        </tr>
      `).join("");
    }
  }

  searchInput.addEventListener("input", doSearch);
  clearBtn.addEventListener("click", () => {
    searchInput.value = "";
    doSearch();
    searchInput.focus();
  });
</script>
